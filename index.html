<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>Student Attendance</h1>
    <p class="subtitle">Mark your presence for today's class</p>
  </header>

  <main>
    <!-- FORM: where the student checks themselves in -->
    <section class="attendance-form" aria-labelledby="form-heading">
      <h2 id="form-heading">Check In</h2>

      <form id="attendanceForm" novalidate>

        <div class="form-group">
          <label for="studentId">Student ID</label>
          <input
            type="text"
            id="studentId"
            name="studentId"
            placeholder="e.g. 2023-00123"
            required
            autocomplete="off"
          >
          <span class="error-message" id="studentIdError"></span>
        </div>

        <div class="form-group">
          <label for="studentName">Full Name</label>
          <input
            type="text"
            id="studentName"
            name="studentName"
            placeholder="e.g. Juan Dela Cruz"
            required
            autocomplete="off"
          >
          <span class="error-message" id="studentNameError"></span>
        </div>

        <button type="submit" class="btn-primary">Mark Present</button>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- LIST: live record of who has checked in -->
    <section class="attendance-list" aria-labelledby="list-heading">
      <h2 id="list-heading">Today's Attendance <span id="countBadge">(0)</span></h2>

      <table id="attendanceTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Student ID</th>
            <th>Name</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="attendanceTableBody">
          <!-- rows injected here by JS -->
        </tbody>
      </table>

      <p class="empty-state" id="emptyState">No students have checked in yet.</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 Student Attendance System</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
